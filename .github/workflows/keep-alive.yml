name: Keep Supabase Alive

on:
  schedule:
    # Chạy mỗi 2 ngày một lần lúc 00:00 UTC
    - cron: "0 0 */2 * *"
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Send API Request to Supabase Table
        run: |
          curl -s -f -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/Projects?select=Id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
